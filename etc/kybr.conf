api="api0.local"
# generate once with: openssl rand -hex 32
backend_auth_token="b1edeafcbaa98878926d550fbab079509b8a90070bb3a4c06326f0bd5e582986"
# role assigned to this node.
# all: assume both compute and database
# compute: assume compute only
role="all"
# Shared cookie for Erlang clustering
# unique per cluster
erlang_cookie=changeme_cookie
# Node specific Erlang/Epmd address
# address to use for talking to cluster members
epmd_address=127.0.0.1
vmd_home="/home/_vmd"
# Rdomain allocation start
rdomain_start_id=1
# Rdomain subnet ID
# 10.${rdomain_subnet_id}.${rdomain_id}.[0-255]
rdomain_subnet_id=0
# Daemon svc user
svc_user="_kybr"
svc_uid=8118
svc_gid=8118
# Cluster location
location="private"
# VLAN auto-provisioning
vlan_enabled=true
vlan_mtu=9000
vlan_parent="ixl1"
# VXLAN
vxlan_enabled=true
vxlan_mtu=8500
# VXLAN underlay VLAN
underlay_mtu=9000
underlay_parent="ixl1"
# Wireguard auto-provision
wireguard_enabled=true
wireguard_endpoint="warp.local"
wireguard_subnet_id=31
wireguard_start_port=40000
# Comma separated list of management node IPs allowed to SSH connect directly
management_nodes="127.0.0.1"
# Manage PF rules
pf_enabled=true
# External dhcpd subnet pools
external_pools="pool0"
external_pool0_netmask="255.255.255.0"
external_pool0_subnet="192.0.2.0"
external_pool0_range_low="192.0.2.1"
external_pool0_range_high="192.0.2.100"
external_pool0_gateway="192.0.2.0"
# Internal/External nameservers in dhcpd
internal_nameservers="1.1.1.1,8.8.8.8"
external_nameservers="9.9.9.9,8.8.4.4"
# Internal/External domain names in dhcpd
internal_domain="internal.local"
external_domain="external.invalid"
# dhcpd next_server IP template used for the autoinstaller
# where the last octet is templated in each rdomain's subnet
next_server_tpl="_._._.0"
# dhcpd listen device types
internal_dhcpd_device="vlan"
external_dhcpd_device="vport"
# Autoinstall
autoinstall_release="8.0"
autoinstall_http_server="https://openbsd.as250.net"
# Relayd ingress device
ingress_listen_device="ixl0"
ingress_rdomain_id="0"
# Mnesia Db
mnesia_dir="/usr/local/kybornos/var/mnesia"
# Builtin admin SSH server
admin_ssh_enabled=true
admin_ssh_port=2222
admin_ssh_sys_dir="/usr/local/kybornos/admin_ssh/sys"
admin_ssh_user_dir="/usr/local/kybornos/admin_ssh/user"
